<!-- 原创 SVG 插画 · 陇原星火 · 场景说明：晨光下的层叠山峦与一条金色精神长河，七颗星火沿河岸轨迹自东向西渐次升起，象征甘肃红色精神谱系的七个坐标 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="晨光下的层叠山峦与金色长河，七颗星火沿轨迹渐次升起">
  <defs>
    <linearGradient id="jsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#EFE4CF"/>
    </linearGradient>
    <path id="jsStar" d="M0 -1 L0.2245 -0.309 L0.9511 -0.309 L0.3633 0.118 L0.5878 0.809 L0 0.382 L-0.5878 0.809 L-0.3633 0.118 L-0.9511 -0.309 L-0.2245 -0.309 Z"/>
  </defs>

  <!-- 天幕 -->
  <rect width="1200" height="675" fill="url(#jsSky)"/>

  <!-- 朝阳与云纹 -->
  <circle cx="1030" cy="140" r="106" fill="#BE8A3C" opacity=".10"/>
  <circle cx="1030" cy="140" r="66" fill="#BE8A3C" opacity=".16"/>
  <circle cx="1030" cy="140" r="26" fill="#BE8A3C" opacity=".24"/>
  <g stroke="#BE8A3C" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".34">
    <path d="M872 232 A 186 186 0 0 1 1148 96"/>
    <path d="M812 288 A 258 258 0 0 1 1180 52"/>
  </g>

  <!-- 远山 -->
  <path d="M0 392 L110 330 205 368 318 296 410 344 512 300 636 356 742 300 850 350 960 312 1075 360 1200 326 1200 675 0 675 Z" fill="#A61B1B" opacity=".10"/>
  <!-- 中山 -->
  <path d="M0 452 L130 392 245 432 372 364 500 424 630 372 756 428 880 380 1000 428 1120 386 1200 420 1200 675 0 675 Z" fill="#A61B1B" opacity=".20"/>
  <!-- 近山 -->
  <path d="M0 512 L150 448 286 490 430 420 562 480 700 428 836 486 972 434 1090 484 1200 442 1200 675 0 675 Z" fill="#A61B1B" opacity=".34"/>

  <!-- 前沿深红地脉 -->
  <path d="M0 560 L150 508 300 548 460 496 620 544 780 498 940 546 1080 508 1200 542 1200 675 0 675 Z" fill="#7A1210" opacity=".92"/>

  <!-- 精神长河（纸白的河面，金线勾边） -->
  <path d="M-12 596 C 170 568 330 640 520 614 C 700 590 830 564 1010 606 C 1100 626 1160 630 1212 620 L1212 680 C 1160 690 1100 686 1010 666 C 830 624 700 650 520 674 C 330 700 170 628 -12 656 Z" fill="#FBF7EE" opacity=".94"/>
  <path d="M-12 596 C 170 568 330 640 520 614 C 700 590 830 564 1010 606 C 1100 626 1160 630 1212 620" stroke="#BE8A3C" stroke-width="2" fill="none" stroke-linecap="round" opacity=".72"/>
  <g stroke="#BE8A3C" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".4">
    <path d="M180 612 Q 232 598 286 610"/>
    <path d="M556 628 Q 608 614 662 626"/>
    <path d="M898 618 Q 952 606 1004 618"/>
  </g>

  <!-- 七颗星火：沿金色的精神轨迹渐次升起 -->
  <path d="M150 486 C 330 436 470 402 620 352 C 740 312 830 282 906 246" stroke="#BE8A3C" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".48"/>
  <use href="#jsStar" transform="translate(162,478) scale(11)" fill="#BE8A3C" opacity=".8"/>
  <use href="#jsStar" transform="translate(300,432) scale(12)" fill="#BE8A3C" opacity=".82"/>
  <use href="#jsStar" transform="translate(428,400) scale(13)" fill="#BE8A3C" opacity=".85"/>
  <use href="#jsStar" transform="translate(546,366) scale(14)" fill="#BE8A3C" opacity=".88"/>
  <use href="#jsStar" transform="translate(656,332) scale(15)" fill="#BE8A3C" opacity=".9"/>
  <use href="#jsStar" transform="translate(772,292) scale(16)" fill="#BE8A3C" opacity=".94"/>
  <circle cx="884" cy="254" r="31" fill="none" stroke="#BE8A3C" stroke-width="1.4" opacity=".5"/>
  <use href="#jsStar" transform="translate(884,254) scale(20)" fill="#A61B1B"/>

  <!-- 细小星尘 -->
  <g fill="#BE8A3C">
    <circle cx="250" cy="300" r="2.6" opacity=".5"/>
    <circle cx="470" cy="248" r="2" opacity=".42"/>
    <circle cx="700" cy="188" r="3" opacity=".46"/>
    <circle cx="1078" cy="304" r="2.4" opacity=".4"/>
    <circle cx="178" cy="330" r="2" opacity=".38"/>
    <circle cx="960" cy="382" r="2.2" opacity=".34"/>
  </g>
</svg>
