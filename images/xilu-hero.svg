<!-- 原创 SVG 插画 · 陇原星火 · 祁连雪峰与断壁残垣间，一面弹痕累累却始终不倒的战旗 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="祁连雪峰与断壁残垣间，一面弹痕累累却始终不倒的战旗">
  <defs>
    <linearGradient id="xiluSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1E4"/>
      <stop offset="1" stop-color="#F7F1E4" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="xiluFlag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F1E4"/>
      <stop offset="1" stop-color="#F7F1E4" stop-opacity=".82"/>
    </linearGradient>
  </defs>

  <!-- 宣纸天幕与一轮淡金寒日 -->
  <rect width="1200" height="675" fill="url(#xiluSky)"/>
  <circle cx="952" cy="168" r="108" fill="#BE8A3C" opacity=".16"/>
  <circle cx="952" cy="168" r="64" fill="#BE8A3C" opacity=".2"/>
  <circle cx="952" cy="168" r="64" fill="none" stroke="#BE8A3C" stroke-width="2" opacity=".5"/>

  <!-- 远层雪峰：朱红山体，纸白雪线 -->
  <path d="M0 505 L108 402 L196 462 L300 366 L422 470 L532 388 L652 472 L760 398 L882 478 L992 408 L1102 480 L1200 428 L1200 675 L0 675 Z" fill="#A61B1B" opacity=".28"/>
  <g fill="#F7F1E4" opacity=".92">
    <path d="M300 366 L276 402 L292 392 L303 410 L316 390 L332 404 L322 380 Z"/>
    <path d="M532 388 L506 426 L522 414 L534 434 L548 412 L566 428 L554 400 Z"/>
    <path d="M760 398 L738 432 L752 422 L763 440 L775 420 L790 434 L780 408 Z"/>
    <path d="M992 408 L970 442 L984 432 L995 450 L1007 430 L1022 444 L1012 418 Z"/>
  </g>
  <path d="M0 505 L108 402 L196 462 L300 366 L422 470 L532 388 L652 472 L760 398 L882 478 L992 408 L1102 480 L1200 428" fill="none" stroke="#7A1210" stroke-width="3" stroke-linecap="round" opacity=".28"/>

  <!-- 中层山脊：朱红加深，压出纵深 -->
  <path d="M0 566 L148 472 L268 536 L392 452 L516 544 L636 472 L758 552 L874 482 L992 552 L1108 502 L1200 546 L1200 675 L0 675 Z" fill="#A61B1B" opacity=".55"/>
  <g fill="#F7F1E4" opacity=".9">
    <path d="M392 452 L364 492 L380 480 L394 500 L410 478 L428 494 L416 466 Z"/>
    <path d="M636 472 L612 508 L626 496 L638 516 L651 494 L668 510 L656 484 Z"/>
    <path d="M874 482 L850 518 L864 506 L876 526 L889 504 L906 520 L894 494 Z"/>
    <path d="M1108 502 L1086 536 L1098 524 L1110 544 L1122 524 L1138 540 L1126 514 Z"/>
  </g>
  <path d="M0 566 L148 472 L268 536 L392 452 L516 544 L636 472 L758 552 L874 482 L992 552 L1108 502 L1200 546" fill="none" stroke="#7A1210" stroke-width="3" stroke-linecap="round" opacity=".38"/>

  <!-- 风蚀线：金色细线扫过山腰 -->
  <g stroke="#BE8A3C" stroke-width="2" stroke-linecap="round" opacity=".42">
    <path d="M70 572 L236 560"/>
    <path d="M256 596 L430 582"/>
    <path d="M470 570 L612 558"/>
    <path d="M636 600 L790 586"/>
    <path d="M822 566 L980 554"/>
    <path d="M1000 600 L1150 588"/>
  </g>

  <!-- 近景戈壁与断墙剪影 -->
  <path d="M0 620 L174 552 L338 606 L520 548 L700 618 L880 566 L1064 620 L1200 592 L1200 675 L0 675 Z" fill="#7A1210"/>
  <g fill="#1F1A17" opacity=".7">
    <path d="M86 606 L104 606 L104 584 L124 584 L124 606 L142 606 L142 620 L86 620 Z"/>
    <path d="M132 600 L146 600 L146 584 L158 584 L158 600 L170 600 L170 620 L132 620 Z" opacity=".8"/>
    <path d="M948 610 L966 610 L966 592 L984 592 L984 610 L1000 610 L1000 622 L948 622 Z"/>
  </g>

  <!-- 旗杆：从戈壁一直立到天空 -->
  <g stroke="#1F1A17" stroke-linecap="round">
    <path d="M734 618 L734 250" stroke-width="7"/>
    <path d="M734 250 L710 238" stroke-width="3" opacity=".6"/>
    <path d="M734 268 C 760 258 772 284 792 276" stroke-width="2" fill="none" opacity=".45"/>
  </g>
  <path d="M714 622 L752 610 L768 622 L734 634 Z" fill="#1F1A17" opacity=".8"/>

  <!-- 战旗：纸白旗面、朱红星徽、金色旗缘，边缘被风撕开 -->
  <path d="M740 260 L902 284 L878 312 L900 338 L850 356 L862 394 L740 372 Z" fill="url(#xiluFlag)" stroke="#7A1210" stroke-width="3" stroke-linejoin="round"/>
  <path d="M740 300 L806 310 M740 330 L792 340" stroke="#7A1210" stroke-width="2" opacity=".3"/>
  <path d="M808 302 L813 317 L829 317 L816 327 L821 342 L808 333 L795 342 L800 327 L787 317 L803 317 Z" fill="#A61B1B"/>
  <path d="M740 260 L902 284 L878 312 L900 338 L850 356 L862 394 L740 372 Z" fill="none" stroke="#BE8A3C" stroke-width="2" opacity=".55"/>

  <!-- 旗角飘带与火星 -->
  <path d="M862 394 L884 404 L872 418 L896 428 L882 438" fill="none" stroke="#BE8A3C" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <g fill="#BE8A3C" opacity=".7">
    <circle cx="930" cy="300" r="4"/>
    <circle cx="958" cy="336" r="3"/>
    <circle cx="916" cy="382" r="2.5"/>
    <circle cx="980" cy="286" r="2"/>
    <circle cx="900" cy="432" r="2.5"/>
  </g>

  <!-- 归鸟与远天 -->
  <g fill="none" stroke="#1F1A17" stroke-width="2.4" stroke-linecap="round" opacity=".4">
    <path d="M300 176 L322 164 L344 176"/>
    <path d="M356 148 L374 138 L392 148"/>
    <path d="M262 212 L278 202 L294 212"/>
  </g>
</svg>
