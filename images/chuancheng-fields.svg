<!-- 原创 SVG 插画 · 陇原星火 · 场景说明：朝阳下的陇原田垄层层展开，一条小路通向远山，田埂上的麦穗与前景麦丛相呼应，寓意把论文写在祖国大地上、把青春扎进乡土 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="朝阳下层叠的田垄与通向远山的小路，田埂上立着麦穗">
  <defs>
    <linearGradient id="cfSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#F7F1E4"/>
    </linearGradient>
    <g id="cfWheat">
      <path d="M0 0 L0 -124" stroke="#7A1210" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g fill="#BE8A3C">
        <ellipse cx="-9" cy="-48" rx="6.5" ry="12" transform="rotate(-24 -9 -48)"/>
        <ellipse cx="9" cy="-48" rx="6.5" ry="12" transform="rotate(24 9 -48)"/>
        <ellipse cx="-9" cy="-70" rx="6.5" ry="12" transform="rotate(-24 -9 -70)"/>
        <ellipse cx="9" cy="-70" rx="6.5" ry="12" transform="rotate(24 9 -70)"/>
        <ellipse cx="0" cy="-98" rx="5.6" ry="11"/>
      </g>
      <g stroke="#BE8A3C" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".8">
        <path d="M0 -120 L-12 -146"/><path d="M0 -120 L0 -152"/><path d="M0 -120 L12 -146"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="675" fill="url(#cfSky)"/>

  <!-- 朝阳 -->
  <circle cx="902" cy="186" r="118" fill="#BE8A3C" opacity=".11"/>
  <circle cx="902" cy="186" r="72" fill="#BE8A3C" opacity=".17"/>
  <circle cx="902" cy="186" r="32" fill="#BE8A3C" opacity=".22"/>
  <g stroke="#BE8A3C" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".3">
    <path d="M754 244 A 156 156 0 0 1 1046 94"/>
    <path d="M714 284 A 208 208 0 0 1 1076 60"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#BE8A3C" stroke-width="2" fill="none" stroke-linecap="round" opacity=".42">
    <path d="M700 142 C 708 130 716 130 724 142 M724 142 C 732 130 740 130 748 142"/>
    <path d="M790 112 C 796 103 802 103 808 112 M808 112 C 814 103 820 103 826 112"/>
  </g>

  <!-- 远山 -->
  <path d="M0 404 L128 350 252 390 376 336 500 388 626 344 752 396 878 350 1002 394 1116 356 1200 388 1200 675 0 675 Z" fill="#A61B1B" opacity=".09"/>
  <path d="M0 458 L146 408 294 450 442 402 590 452 738 408 886 456 1034 412 1200 454 1200 675 0 675 Z" fill="#A61B1B" opacity=".16"/>

  <!-- 远层田垄 -->
  <path d="M0 486 C 300 458 760 434 1200 378 L1200 675 0 675 Z" fill="#EFE4CF"/>
  <path d="M0 486 C 300 458 760 434 1200 378" stroke="#BE8A3C" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".55"/>
  <g stroke="#BE8A3C" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".4">
    <path d="M0 518 C 300 490 758 468 1200 414"/>
    <path d="M0 552 C 300 526 756 504 1200 452"/>
  </g>

  <!-- 近层田垄（台地） -->
  <path d="M0 576 C 320 548 780 526 1200 476 L1200 675 0 675 Z" fill="#F7F1E4"/>
  <path d="M0 566 C 320 538 780 516 1200 466" stroke="#A61B1B" stroke-width="7" fill="none" stroke-linecap="round" opacity=".06"/>
  <path d="M0 576 C 320 548 780 526 1200 476" stroke="#BE8A3C" stroke-width="2" fill="none" stroke-linecap="round" opacity=".62"/>
  <g stroke="#BE8A3C" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".45">
    <path d="M0 610 C 330 582 790 562 1200 516"/>
    <path d="M0 644 C 340 618 800 598 1200 554"/>
  </g>

  <!-- 通向远山的小路 -->
  <path d="M286 675 C 470 620 700 566 934 500 L978 504 C 736 572 528 628 462 675 Z" fill="#FBF7EE"/>
  <path d="M286 675 C 470 620 700 566 934 500" stroke="#BE8A3C" stroke-width="1.7" fill="none" stroke-linecap="round" opacity=".6"/>
  <path d="M462 675 C 528 628 736 572 978 504" stroke="#BE8A3C" stroke-width="1.7" fill="none" stroke-linecap="round" opacity=".6"/>

  <!-- 田埂上的麦穗 -->
  <use href="#cfWheat" transform="translate(660,612) scale(.92)"/>
  <use href="#cfWheat" transform="translate(704,624) scale(.76)"/>
  <use href="#cfWheat" transform="translate(1016,548) scale(1)"/>
  <use href="#cfWheat" transform="translate(1074,566) scale(.84)"/>
  <use href="#cfWheat" transform="translate(1128,582) scale(.7)"/>

  <!-- 前景麦丛 -->
  <use href="#cfWheat" transform="translate(78,672) scale(1.12)"/>
  <use href="#cfWheat" transform="translate(126,676) scale(1.34)"/>
  <use href="#cfWheat" transform="translate(174,672) scale(1.02)"/>
  <use href="#cfWheat" transform="translate(214,678) scale(.86)"/>

  <!-- 前景深红土层 -->
  <path d="M0 662 L220 656 440 664 660 656 880 666 1100 658 1200 664 1200 675 0 675 Z" fill="#7A1210" opacity=".88"/>

  <!-- 星尘 -->
  <g fill="#BE8A3C">
    <circle cx="170" cy="214" r="2.4" opacity=".34"/>
    <circle cx="318" cy="152" r="2" opacity=".3"/>
    <circle cx="500" cy="220" r="2.4" opacity=".32"/>
    <circle cx="656" cy="140" r="2" opacity=".28"/>
  </g>
</svg>
