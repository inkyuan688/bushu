<!-- 原创 SVG 插画 · 陇原星火 · 校史印记：校园主楼剪影与陇原田野 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="校园主楼剪影立于层叠山峦与田野之间">
  <defs>
