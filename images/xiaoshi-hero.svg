      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#F2E7D3"/>
    </linearGradient>
    <linearGradient id="xmtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A61B1B"/>
      <stop offset="1" stop-color="#7A1210"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#xsky)"/>

  <!-- 日轮 -->
  <circle cx="928" cy="152" r="86" fill="#C6392C" opacity=".13"/>
  <circle cx="928" cy="152" r="54" fill="#C6392C" opacity=".2"/>

  <!-- 远山 -->
