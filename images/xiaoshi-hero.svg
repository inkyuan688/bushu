    </g>
  </g>

  <!-- 树列 -->
  <g fill="#7A1210" opacity=".85">
    <circle cx="300" cy="430" r="26"/><rect x="296" y="430" width="8" height="46"/>
    <circle cx="256" cy="446" r="20"/><rect x="252" y="446" width="8" height="34"/>
    <circle cx="900" cy="428" r="26"/><rect x="896" y="428" width="8" height="48"/>
    <circle cx="946" cy="446" r="20"/><rect x="942" y="446" width="8" height="32"/>
  </g>

  <!-- 前景田垄 -->
  <path d="M0 675 L0 520 C 260 500 520 540 760 516 C 980 494 1100 520 1200 508 L1200 675 Z" fill="#A61B1B" opacity=".18"/>
  <g fill="none" stroke="#7A1210" stroke-width="2.6" opacity=".42">
    <path d="M0 566 C 240 546 500 584 760 560 C 960 542 1100 566 1200 554"/>
    <path d="M0 606 C 250 586 520 626 780 600 C 980 580 1110 606 1200 594"/>
    <path d="M0 646 C 260 626 540 668 800 640 C 1000 620 1120 646 1200 634"/>
  </g>
  <path d="M0 675 L0 632 C 280 612 560 652 820 626 C 1020 606 1130 630 1200 620 L1200 675 Z" fill="#5E0D0C" opacity=".9"/>

