    <path d="M150 652 L150 604"/><path d="M150 620 l-14 -12"/><path d="M150 620 l14 -12"/>
    <path d="M150 636 l-14 -12"/><path d="M150 636 l14 -12"/>
    <path d="M210 648 L210 612"/><path d="M210 624 l-11 -10"/><path d="M210 624 l11 -10"/>
    <path d="M1046 648 L1046 606"/><path d="M1046 618 l-13 -12"/><path d="M1046 618 l13 -12"/>
    <path d="M1046 634 l-13 -12"/><path d="M1046 634 l13 -12"/>
